<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Testportaal TravelCard (nagebouwd)</title><style>body{font:14px system-ui;max-width:560px;margin:30px auto}label,.lbl{display:block;font-size:12px;color:#444;margin-top:8px}input,select{padding:4px}.uitleg{color:#666}.stap{border:1px solid #ddd;padding:10px;margin:10px 0}</style></head><body>
<h1>Nagebouwd: reiskaart voor nieuwe kaarthouder</h1>
<p class="uitleg">Geen echt portaal. Velden volgens de handleiding van het reiskaartportaal: voorletters met punten, postcode zonder spatie, telefoon zakelijk en mobiel apart, ingangsdatum van de kaart.</p>
<form>
<h3>Kaarthouder</h3>
<fieldset><legend>Aanhef</legend><label><input type="radio" name="aanhef" value="dhr"> De heer</label><label><input type="radio" name="aanhef" value="mevr"> Mevrouw</label></fieldset>
<label for="vl">Voorletters</label><input id="vl" name="voorletters" maxlength="8">
<label for="tv">Tussenvoegsel</label><input id="tv" name="tussenvoegsel" maxlength="7">
<label for="an">Achternaam</label><input id="an" name="achternaam" maxlength="25">
<label for="gd">Geboortedatum</label><input id="gd" name="geboortedatum" placeholder="DD-MM-JJJJ">
<label for="em">E-mailadres</label><input id="em" type="email" name="email">
<label for="tz">Telefoonnummer zakelijk</label><input id="tz" name="telzakelijk" maxlength="10">
<label for="tm">Telefoonnummer mobiel</label><input id="tm" name="telmobiel" maxlength="10">
<label for="st">Straat</label><input id="st" name="straat">
<label for="hn">Huisnummer</label><input id="hn" name="huisnummer" maxlength="5">
<label for="ht">Toevoeging huisnummer</label><input id="ht" name="toevoeging" maxlength="5">
<label for="pc">Postcode</label><input id="pc" name="postcode" maxlength="6">
<label for="wp">Woonplaats</label><input id="wp" name="woonplaats">
<label for="af">Afdeling</label><select id="af" name="afdeling"><option value="">Kies afdeling</option><option value="a1">Voorbeeld BV</option></select>
<label for="kp">Kostenplaats</label><input id="kp" name="kostenplaats">
<label for="pn">Personeelsnummer</label><input id="pn" name="personeelsnummer">
<h3>Kaartdetails</h3>
<label for="ig">Gewenste ingangsdatum</label><input id="ig" type="date" name="ingangsdatum">
</form>

<button type="button" id="verstuur">Verstuur (toont wat het portaal ontvangt)</button><pre id="uit"></pre>
<script>document.getElementById("verstuur").onclick=()=>{const d={};document.querySelectorAll("form").forEach(f=>new FormData(f).forEach((v,k)=>d[k]=v));document.getElementById("uit").textContent=JSON.stringify(d,null,2)};</script></body></html>
