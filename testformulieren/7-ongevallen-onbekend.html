<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Testportaal ongevallenverzekering (nagebouwd)</title><style>body{font:14px system-ui;max-width:560px;margin:30px auto}label,.lbl{display:block;font-size:12px;color:#444;margin-top:8px}input,select{padding:4px}.uitleg{color:#666}.stap{border:1px solid #ddd;padding:10px;margin:10px 0}</style></head><body>
<h1>Nagebouwd: verzekerde aanmelden (ongevallenverzekering)</h1>
<p class="uitleg">Geen echt portaal: de echte velden van Insurer B zijn onbekend. Test de lastige gevallen: datum in drie tekstvakjes, één label boven huisnummer en toevoeging, alleen een telefoonveld.</p>
<form>
<label for="nv">Naam verzekerde</label><input id="nv" name="naam">
<div><span class="lbl">Geboortedatum</span><input name="gd_d" maxlength="2" placeholder="dd" size="2"> <input name="gd_m" maxlength="2" placeholder="mm" size="2"> <input name="gd_j" maxlength="4" placeholder="jjjj" size="4"></div>
<label for="gs">Geslacht</label><select id="gs" name="geslacht"><option value="">Maak een keuze</option><option value="M">Man</option><option value="V">Vrouw</option></select>
<div><span class="lbl">Huisnummer + toevoeging</span><input name="hnr" size="5"><input name="htv" size="3" maxlength="4"></div>
<label for="pc">Postcode</label><input id="pc" name="postcode">
<label for="tel">Telefoonnummer</label><input id="tel" name="telefoon">
<label for="sa">Startdatum arbeidsovereenkomst</label><input id="sa" name="start" placeholder="dd/mm/jjjj">
<label for="ml">Maandloon</label><input id="ml" name="maandloon">
<label for="iban">IBAN</label><input id="iban" name="iban">
</form>

<button type="button" id="verstuur">Verstuur (toont wat het portaal ontvangt)</button><pre id="uit"></pre>
<script>document.getElementById("verstuur").onclick=()=>{const d={};document.querySelectorAll("form").forEach(f=>new FormData(f).forEach((v,k)=>d[k]=v));document.getElementById("uit").textContent=JSON.stringify(d,null,2)};</script></body></html>
